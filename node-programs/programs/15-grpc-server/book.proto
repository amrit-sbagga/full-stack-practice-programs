syntax = "proto3";

package books;

service BookService {
    rpc GetBook (GetBookRequest) returns (Book);
    rpc ListBooks (Empty) returns (ListBooksResponse);
}

message Empty {}

message GetBookRequest {
    string id = 1;
}

message Book {
    string id = 1;
    string title = 2;
    string author = 3;
    int32 year = 4;
}

message ListBooksResponse {
    repeated Book books = 1;
}